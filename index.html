<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#06100d" />
    <title>アタリ検知アプリ</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="stage-panel">
        <div class="stage" id="stage">
          <video id="videoInput" playsinline autoplay muted></video>
          <canvas id="overlay"></canvas>
          <div class="bite-flash" id="biteFlash">アタリ候補</div>
        </div>
      </section>

      <section class="control-panel">
        <div class="status-grid">
          <div>
            <span class="label">状態</span>
            <strong id="stateText">待機中</strong>
          </div>
          <div>
            <span class="label">追跡</span>
            <strong id="trackingText">0/0</strong>
          </div>
          <div>
            <span class="label">スコア</span>
            <strong id="scoreText">0.00</strong>
          </div>
          <div>
            <span class="label">OpenCV</span>
            <strong id="opencvText">読込中</strong>
          </div>
        </div>

        <canvas class="signal" id="signalCanvas" width="640" height="96"></canvas>

        <div class="controls">
          <button id="cameraButton">カメラ開始</button>
          <button id="registerButton" disabled>3点登録</button>
          <button id="undoButton" disabled>1つ戻す</button>
          <button id="clearButton" disabled>全消去</button>
          <button id="doneButton" disabled>登録完了</button>
          <button id="trackingButton" disabled>追跡開始</button>
          <button id="markButton" disabled>アタリ記録</button>
          <button id="resetButton" disabled>リセット</button>
          <button id="exportCsvButton" disabled>CSV保存</button>
          <button id="exportJsonButton" disabled>JSON保存</button>
        </div>

        <label class="slider-row">
          <span>感度</span>
          <input id="sensitivityInput" type="range" min="0" max="100" value="58" />
          <output id="sensitivityText">58</output>
        </label>

        <p class="note" id="messageText">
          カメラ開始後、3点登録でロッドの元側・中間・穂先側を順番にタップしてください。
        </p>
      </section>
    </main>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
